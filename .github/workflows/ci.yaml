name: CloudFormation CI Pipeline (Reusable)
description: |
  This is a reusable GitHub Actions workflow for CI/CD using CloudFormation.
  It includes steps for linting, validating, scanning, and building AWS resources.
  The workflow is designed to be triggered by other workflows or manually.
  It also includes steps for checking environments, detecting changes, and preparing builds.

on:
  workflow_call:
    inputs:
      environment:
        description: "Environment to deploy to (e.g., ci, devl, test, prod)."
        required: true
        type: string
      cfn-directory:
        description: "Directory containing CloudFormation template files."
        required: true
        type: string
        default: 'cfn'
      ci-build:
        description: "Indicates if this is a CI build run."
        required: false
        type: boolean
        default: true
    secrets:
      aws-role-arn:
        description: "AWS role ARN for assuming a role."
        required: true
      infracost-api-key:
        description: "API key for Infracost."
        required: true
      infracost-gist-id:
        description: "Gist ID for Infracost output."
        required: true
    outputs:
      template-path:
        description: "Path to the CloudFormation template file"
        value: ${{ jobs.execution-path.outputs.template-path }}

permissions:
  id-token: write
  contents: write

jobs:
  check-environments:
    name: 🔎 Check Env
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Check Available Environments
        id: check
        uses: subhamay-bhattacharyya-gha/check-environments-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          org-short-name: ${{ vars.ORG_SHORT_NAME != '' && vars.ORG_SHORT_NAME || 'org' }}
          region: ${{ vars.AWS_REGION != '' && vars.AWS_REGION || 'us-east-1' }}

  check-branch-issue:
    name: 🔎 Check Branch
    runs-on: ubuntu-latest
    steps:
      - name: Verify branch issue
        id: branch-issue
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: subhamay-bhattacharyya-gha/branch-issue-action@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Print Outputs
        if: ${{ github.ref != 'refs/heads/main' }}
        run: |
          echo "Branch Issue: ${{ steps.branch-issue.outputs.issue-number }}"
          echo "Branch Issue: ${{ steps.branch-issue.outputs.issue-exists }}"

  detect-changes:
    name: 🔎 Detect Change
    runs-on: ubuntu-latest
    outputs:
      files-changed: ${{ steps.repo-changes.outputs.files-changed }}
      json-output: ${{ steps.repo-changes.outputs.json-output }}
      has-changes: ${{ steps.repo-changes.outputs.has-changes }}
    steps:
      - name: Detect repository changes
        id: repo-changes
        if: ${{ github.ref != 'refs/heads/main' }}
        uses: subhamay-bhattacharyya-gha/list-updated-files-action@main

  detect-services:
    name: 🔎 Detect Services
    runs-on: ubuntu-latest
    outputs:
      services-used: ${{ steps.scan.outputs.services-used }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Scan AWS Services
        id: scan
        uses: subhamay-bhattacharyya-gha/scan-aws-services-action@main

      - name: Save Detected Services to Environment Variable
        run: |
          echo "Detected Services: ${{ steps.scan.outputs.services-used }}"
          echo 'SERVICES_USED=${{ steps.scan.outputs.services-used }}' >> $GITHUB_ENV

      - name: Print AWS Service Detection Table
        run: |
          echo "## AWS Services Detected" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Service               | Used |" >> $GITHUB_STEP_SUMMARY
          echo "|------------------------|------|" >> $GITHUB_STEP_SUMMARY
          echo "🔍 Raw SERVICES_USED: $SERVICES_USED"
          node -e "
          try {
            const raw = process.env.SERVICES_USED;
            const result = JSON.parse(raw);
            const emoji = (val) => val ? '✅' : '❌';
            const rows = Object.entries(result).map(([key, val]) => \`| \${key.padEnd(22)} | \${emoji(val)} |\`).join('\n');
            require('fs').appendFileSync(process.env.GITHUB_STEP_SUMMARY, rows + '\n');
          } catch (e) {
            console.error('❌ Failed to parse SERVICES_USED:', e.message);
            console.error('💥 Value received:', process.env.SERVICES_USED);
            process.exit(1);
          }"

  execution-path:
    name: 🔎 Det. Exec Path
    runs-on: ubuntu-latest
    needs: [check-environments, check-branch-issue, detect-services, detect-changes]
    outputs:
      execution-path: ${{ steps.set-path.outputs.execution-path }}
      template-path: ${{ steps.read-template.outputs.template-path }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Read Template Configuration
        id: read-template
        run: |
          # Read template name from cloudformation.json
          CONFIG_FILE="${{ github.workspace }}/${{ inputs.cfn-directory }}/cloudformation.json"
          
          if [ ! -f "$CONFIG_FILE" ]; then
            echo "❌ Configuration file not found: $CONFIG_FILE"
            exit 1
          fi
          
          TEMPLATE_NAME=$(jq -r '.template' "$CONFIG_FILE")
          
          if [ "$TEMPLATE_NAME" == "null" ] || [ -z "$TEMPLATE_NAME" ]; then
            echo "❌ Template name not found in configuration file"
            exit 1
          fi
          
          TEMPLATE_PATH="${{ inputs.cfn-directory }}/$TEMPLATE_NAME"
          
          echo "🔍 Found CloudFormation template: $TEMPLATE_NAME"
          echo "📁 Template path: $TEMPLATE_PATH"
          
          # Set template path as step output
          echo "template-path=$TEMPLATE_PATH" >> $GITHUB_OUTPUT

      - name: Determine services used and repo changes
        id: prepare-inputs
        run: |
          if [ -z "${{ needs.detect-changes.outputs.json-output }}" ]; then
            echo "{}" > repo-changes.json
          else
            echo "${{ needs.detect-changes.outputs.json-output }}" | base64 -d > repo-changes.json
          fi
          echo "${{ needs.detect-changes.outputs.json-output }}" | base64 -d > repo-changes.json
          sed -E 's/([{,])([^:{]+):/\1"\2":/g' <<< "${{ needs.detect-services.outputs.services-used }}" > services-used.json

      - name: Debug parsed input files
        run: |
          echo "Repo Changes JSON"
          cat repo-changes.json
          echo "---------------------------"
          echo "Services Used JSON"
          cat services-used.json
          
      - name: Set Execution Path
        id: set-path
        uses: subhamay-bhattacharyya-gha/exec-path-action@main
        with:
          files-modified: repo-changes.json
          services-used: services-used.json
          
      - name: Upload execution path artifact
        uses: actions/upload-artifact@v4
        with:
          name: execution-path-data
          path: execution-path.json
          retention-days: 30

  cloudformation-validate:
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path).IaC == true }}
    name: ✔️ CloudFormation Validate
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [execution-path]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ vars.AWS_REGION }}
          
      - name: Validate CloudFormation Template
        run: |
          # Use template path from execution-path job
          TEMPLATE_PATH="${{ needs.execution-path.outputs.template-path }}"
          TEMPLATE_NAME=$(basename "$TEMPLATE_PATH")
          
          echo "🔍 Validating CloudFormation template: $TEMPLATE_NAME"
          
          if [ ! -f "$TEMPLATE_PATH" ]; then
            echo "❌ Template file not found: $TEMPLATE_PATH"
            exit 1
          fi
          
          echo "Validating template: $TEMPLATE_PATH"
          aws cloudformation validate-template --template-body file://$TEMPLATE_PATH
          
          if [ $? -eq 0 ]; then
            echo "✅ Template $TEMPLATE_PATH is valid"
          else
            echo "❌ Template $TEMPLATE_PATH validation failed"
            exit 1
          fi
          
          echo "✅ CloudFormation template validated successfully"

  cloudformation-lint:
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path).IaC == true }}
    name: 📋 CloudFormation Lint
    runs-on: ubuntu-latest
    needs: [execution-path]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
          
      - name: Install cfn-lint
        run: |
          pip install cfn-lint
          
      - name: Prepare CloudFormation Parameters
        id: prepare-params
        uses: subhamay-bhattacharyya-gha/cfn-stack-params-action@feature/GHA-0001-initial-release
        with:
          cfn-directory: ${{ inputs.cfn-directory }}
          ci-build: ${{ inputs.ci-build }}
          environment: 'ci'
          
      - name: Print cfn-stack-params-action Output
        run: |
          echo "🔍 cfn-stack-params-action Output:"
          echo "=================================="
          echo "Parameters: ${{ steps.prepare-params.outputs.parameters }}"
          echo "Stack Name: ${{ steps.prepare-params.outputs.stack-name }}"
          echo "=================================="
          
          # Create params directory if it doesn't exist
          PARAMS_DIR="${{ github.workspace }}/${{ inputs.cfn-directory }}/params"
          mkdir -p "$PARAMS_DIR"
          
      - name: Create Deployment JSON File
        id: create-deployment-json
        run: |
          echo "Creating deployment JSON file..."
          
          # Create directory for artifacts
          mkdir -p artifacts
          
          # Create JSON file with parameters, stack-name, and template-path
          cat > artifacts/deployment.json << EOF
          {
            "parameters": ${{ steps.prepare-params.outputs.parameters }},
            "stack-name": "${{ steps.prepare-params.outputs.stack-name }}",
            "template-path": "${{ needs.execution-path.outputs.template-path }}"
          }
          EOF
          
          echo "✅ Created deployment.json:"
          cat artifacts/deployment.json
          
      - name: Upload Deployment JSON as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-parameters
          path: artifacts/deployment.json
          retention-days: 7
          
      - name: Run CloudFormation Lint
        run: |
          # Use template path from execution-path job output
          TEMPLATE_PATH="${{ needs.execution-path.outputs.template-path }}"
          TEMPLATE_NAME=$(basename "$TEMPLATE_PATH")
          
          echo "🔍 Running cfn-lint on CloudFormation template: $TEMPLATE_NAME"
          
          # Ensure we're working with the full path from workspace root
          FULL_TEMPLATE_PATH="${{ github.workspace }}/$TEMPLATE_PATH"
          
          if [ ! -f "$FULL_TEMPLATE_PATH" ]; then
            echo "❌ Template file not found: $FULL_TEMPLATE_PATH"
            exit 1
          fi
          
          echo "Linting template: $TEMPLATE_PATH"
          
          # Run cfn-lint and capture output (don't exit on failure yet)
          set +e  # Disable exit on error temporarily
          
          # Run cfn-lint (cfn-lint validates template structure and syntax, not parameter values)
          echo "Running cfn-lint on template: $FULL_TEMPLATE_PATH"
          LINT_OUTPUT=$(cfn-lint --format parseable "$FULL_TEMPLATE_PATH" 2>&1)
          
          LINT_EXIT_CODE=$?
          set -e  # Re-enable exit on error
          
          # Add cfn-lint results to GitHub Step Summary
          echo "## 📋 CloudFormation Lint Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Template:** \`$TEMPLATE_PATH\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ $LINT_EXIT_CODE -eq 0 ]; then
            echo "### ✅ Linting Passed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No issues found in the CloudFormation template." >> $GITHUB_STEP_SUMMARY
            echo "✅ Template $TEMPLATE_PATH passed linting"
          else
            echo "### ❌ Linting Issues Found (Exit Code: $LINT_EXIT_CODE)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            if [ -n "$LINT_OUTPUT" ]; then
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
              echo "$LINT_OUTPUT" >> $GITHUB_STEP_SUMMARY
              echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            else
              echo "No detailed output available from cfn-lint." >> $GITHUB_STEP_SUMMARY
            fi
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**cfn-lint Exit Codes:**" >> $GITHUB_STEP_SUMMARY
            echo "- 0: No issues" >> $GITHUB_STEP_SUMMARY
            echo "- 2: Warnings found" >> $GITHUB_STEP_SUMMARY
            echo "- 4: Errors found" >> $GITHUB_STEP_SUMMARY
            echo "- 8: Invalid CLI arguments" >> $GITHUB_STEP_SUMMARY
            echo "- 16: Fatal errors" >> $GITHUB_STEP_SUMMARY
            
            echo "❌ Template $TEMPLATE_PATH failed linting (exit code: $LINT_EXIT_CODE)"
            echo "Lint output:"
            echo "$LINT_OUTPUT"
            exit $LINT_EXIT_CODE
          fi
          
          echo "✅ CloudFormation linting completed successfully"
          
      - name: Print Job Outputs
        run: |
          echo "📋 CloudFormation Lint Job Outputs:"
          echo "Parameters: ${{ steps.prepare-params.outputs.parameters }}"
          echo "Stack Name: ${{ steps.prepare-params.outputs.stack-name }}"
          
      - name: Display Prepared Parameters
        run: |
          echo "## 📋 CloudFormation Parameters" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Parameters File:** \`${{ inputs.cfn-directory }}/parameters.json\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ -n "${{ steps.prepare-params.outputs.parameters }}" ]; then
            echo "### Prepared Parameters:" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            echo '${{ steps.prepare-params.outputs.parameters }}' | jq . >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            
            echo "✅ CloudFormation parameters prepared successfully"
            echo "Prepared parameters:"
            echo "${{ steps.prepare-params.outputs.parameters }}"
          else
            echo "### ⚠️ No Parameters Found" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "No parameters were found or prepared from the parameters file." >> $GITHUB_STEP_SUMMARY
            
            echo "⚠️ No parameters found in the parameters file"
          fi

  checkov-scan:
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path).IaC == true }}
    name: 🧳 Checkov Scan
    runs-on: ubuntu-latest
    needs: [execution-path]
    environment: ${{ inputs.environment }}

    steps:
        - name: Checkout Code
          uses: actions/checkout@v4
          
          
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.aws-role-arn }}
            aws-region: ${{ vars.AWS_REGION }}

        - name: Checkov Scan
          uses: subhamay-bhattacharyya-gha/checkov-scan-action@main
          id: checkov-scan
          with:
            iac-dir: ${{ inputs.cfn-directory }}
            iac-framework: cloudformation
            soft-fail: true
            
        - name: Confirm SARIF file type
          shell: bash
          run: |
            ls -la "${{ github.workspace }}"
            file "${{ github.workspace }}/results.sarif"

        - name: "📋 Summarize and Print Checkov Scan Report with Snippets"
          id: summarize-report
          uses: subhamay-bhattacharyya-gha/checkov-report-action@main

  build-lambda:
    name: 🛠️ ⛔ Lambda Package
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path).lambda == true }}
    runs-on: ubuntu-latest
    needs: [execution-path, detect-services, detect-changes]
    steps:
      - name: Build and Upload Lambda Package
        run: echo "Uploading Lambda package..."

  build-lambda-layer:
    name: 🛠️ ⛔ Lambda Layer
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path)['lambda-layer'] == true }}
    runs-on: ubuntu-latest
    needs: [execution-path, detect-services, detect-changes]
    steps:
      - name: Build Lambda Layer Package
        run: echo "No changes in Lambda layer package, skipping build..."
      - name: Build and Upload Lambda Layer Package
        run: echo "Build and Upload Lambda layer...."

  build-glue:
    name: 🛠️ ⛔ Glue Script
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path).glue == true }}
    runs-on: ubuntu-latest
    needs: [execution-path, detect-services, detect-changes]
    steps:
      - name: Package Glue Script
        run: echo "No changes found in Glue script, skipping build..."
      - name: Package and Upload Glue Script
        run: echo "Uploading Glue script..."

  build-state-machine:
    name: 🛠️ ⛔ State Machine
    if: ${{ needs.execution-path.result == 'success' && needs.execution-path.outputs.execution-path && fromJSON(needs.execution-path.outputs.execution-path)['state-machine'] == true }}
    runs-on: ubuntu-latest
    needs: [execution-path, detect-services, detect-changes]
    steps:
      - name: Package State Machine
        run: echo "No changes in State Machine, skipping build."
      - name: Upload State Machine ASL
        run: echo "Uploading State Machine ASL..."

  yor-resource-tagging:
    name: 📋 Apply Git Metadata Tags using YOR
    if: ${{ needs.cloudformation-lint.result == 'success' && needs.cloudformation-validate.result == 'success' && needs.checkov-scan.result == 'success' }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [cloudformation-lint, cloudformation-validate, checkov-scan]
    steps:
            
        - name: YOR Tagging
          run: |
            echo "YOR Tagging"

  cloudformation-create:
    if: ${{ needs.yor-resource-tagging.result == 'success' }}
    name: 🚧 CloudFormation Create Stack
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [yor-resource-tagging]

    steps:
        - name: Checkout Code
          uses: actions/checkout@v4
          
        - name: Download Deployment Parameters Artifact
          uses: actions/download-artifact@v4
          with:
            name: deployment-parameters
            path: ./artifacts
            
        - name: Configure AWS Credentials
          uses: aws-actions/configure-aws-credentials@v4
          with:
            role-to-assume: ${{ secrets.aws-role-arn }}
            aws-region: ${{ vars.AWS_REGION }}

        - name: Read Deployment Parameters
          id: read-params
          uses: subhamay-bhattacharyya-gha/cfn-read-deployment-params-action@feature/GHA-0001-initial-release
          with:
            artifact-path: './artifacts/deployment.json'

        - name: Print the Deployment Parameters
          id: print-params
          shell: bash
          run: |
            echo "📋 CloudFormation Deployment Parameters Summary"
            echo "=============================================="
            echo "Stack Name: ${{ steps.read-params.outputs.stack-name }}"
            echo "Template Path: ${{ env.DEPLOYMENT_TEMPLATE_PATH }}"
            echo "Parameters: ${{ env.DEPLOYMENT_PARAMETERS }}"
            
            # Store parameters in a variable for processing
            PARAMS='${{ env.DEPLOYMENT_PARAMETERS }}'
            echo "$PARAMS" > params.json
            
            echo "Parameters formatted:"
            # Check if parameters are in CloudFormation format (array of objects) or simple key-value format
            if [[ "$PARAMS" == "["* ]]; then
              # CloudFormation format: [{"ParameterName":"key","ParameterValue":"value"}]
              jq -r '.[] | "  \(.ParameterName) = \(.ParameterValue)"' params.json
            else
              # Simple key-value format: {"key":"value"}
              jq -r 'to_entries[] | "  \(.key) = \(.value)"' params.json
            fi
            
            echo "=============================================="
            
            # Add to GitHub Step Summary
            echo "## 📋 CloudFormation Deployment Parameters" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Stack Name:** \`${{ env.DEPLOYMENT_STACK_NAME }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Template Path:** \`${{ env.DEPLOYMENT_TEMPLATE_PATH }}\`" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "**Parameters:**" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
            cat params.json | jq . >> $GITHUB_STEP_SUMMARY
            echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
            
        # - name: Deploy CloudFormation Stack
        #   uses: subhamay-bhattacharyya-gha/cfn-create-stack-action@feature/GHA-0001-initial-release
        #   with: 
        #     stack-name: ${{ steps.read-params.outputs.stack-name }}
        #     stack-path: ${{ steps.read-params.outputs.template-path }}
        #     deployment-parameters: ${{ steps.read-params.outputs.parameters }} 

  cloudformation-delete:
    if: ${{ needs.cloudformation-create.result == 'success' }}
    name: ✂️ CloudFormation Destroy
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    needs: [cloudformation-create]

    steps:
      - name: Download Deployment Parameters Artifact
        uses: actions/download-artifact@v4
        with:
          name: deployment-parameters
          path: ./artifacts
        
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.aws-role-arn }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Read Deployment Parameters
        id: read-params
        uses: subhamay-bhattacharyya-gha/cfn-read-deployment-params-action@feature/GHA-0001-initial-release
        with:
          artifact-path: './artifacts/deployment.json'

      - name: Print the Deployment Parameters
        id: print-params
        shell: bash
        run: |
            echo "📋 CloudFormation Deployment Parameters Summary"
            echo "=============================================="
            echo "Stack Name: ${{ env.DEPLOYMENT_STACK_NAME }}"

      - name: CloudFormation Delete Stack
        run: |
          echo "CloudFormation Delete Stack"
          echo "Deleting Stack: ${{ steps.read-params.outputs.stack-name }}"
            
  create-pull-request:
    name: 🚀 Create Pull Request
    runs-on: ubuntu-latest
    needs:
      - cloudformation-lint
      - cloudformation-validate
      - cloudformation-create
      - cloudformation-delete
      - yor-resource-tagging
      - checkov-scan
      - build-lambda
      - build-lambda-layer
      - build-glue
      - build-state-machine
    if: >-
      ${{
        always() &&
        needs.cloudformation-lint.result != 'failure' &&
        needs.cloudformation-validate.result != 'failure' &&
        needs.cloudformation-create.result != 'failure' &&
        needs.cloudformation-delete.result != 'failure' &&
        needs.yor-resource-tagging.result != 'failure' &&
        needs.checkov-scan.result != 'failure' &&
        needs.build-lambda.result != 'failure' &&
        needs.build-lambda-layer.result != 'failure' &&
        needs.build-glue.result != 'failure' &&
        needs.build-state-machine.result != 'failure'
      }}
    steps:
      - name: Create Pull Request
        run: echo "Create pull request manually..."